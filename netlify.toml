# Netlify deploy for the Aido web app (monorepo).
# IMPORTANT: in the Netlify UI, leave "Base directory" EMPTY (repo root).
# Setting it to apps/web or apps/mobile breaks the publish path below.
# Build command and Publish directory come from here.
[build]
  command = "pnpm --filter @aido/web build"
  publish = "apps/web/.next"

[build.environment]
  NETLIFY_USE_PNPM = "true"
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
